<title>閲覧にはパスワードが必要です</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--sub:#61707f;--line:#d5dce3;--acc:#0a6ebd;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1e242a;--ink:#e8edf2;--sub:#9aa7b3;--line:#35404a;--acc:#4ea3e6;--err:#ff7b6b}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px 28px}
h1{font-size:18px;margin:0 0 8px}p{font-size:13px;color:var(--sub);margin:0 0 20px;line-height:1.7}
input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{width:100%;margin-top:12px;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label.rm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub);margin-top:14px}
label.rm input{width:auto}
.err{color:var(--err);font-size:13px;min-height:1.4em;margin-top:10px}
</style></head><body>
<form class="card" id="f" autocomplete="off">

<p>このページはデモサイトのため限定公開しています。共有されたパスワードを入力してください。</p>

<label class="rm"><input id="rm" type="checkbox" checked>このブラウザで記憶する</label>
<button id="bt" type="submit">表示する</button>
<div class="err" id="er" role="alert"></div>
</form>

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function hex(a){return Array.from(new Uint8Array(a)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}

async function open(raw,rem){
